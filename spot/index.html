<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TapStock - Spot öffnen</title>
    <meta name="description" content="Öffne diesen Spot in TapStock.">
    
    <!-- Open Graph -->
    <meta property="og:title" content="TapStock - Spot öffnen">
    <meta property="og:description" content="Scanne den NFC-Tag um diesen Spot in TapStock zu öffnen.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="https://tapstock.app/og-image.jpg">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png">
    <link rel="apple-touch-icon" href="/favicon.png">
    
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #F59E0B;
            --primary-light: #FBBF24;
            --primary-dark: #D97706;
            --primary-alpha: rgba(245, 158, 11, 0.15);
            --bg-primary: #0D0D0F;
            --bg-secondary: #1A1A1E;
            --bg-surface2: #252529;
            --bg-surface3: #2F2F35;
            --text-primary: #FAFAFA;
            --text-secondary: #71717A;
            --radius: 16px;
            --radius-sm: 12px;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
        }
        
        .container {
            max-width: 400px;
            width: 100%;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .logo-icon {
            width: 56px;
            height: 56px;
            border-radius: 12px;
        }
        
        .brand {
            font-size: 32px;
            font-weight: 700;
            color: var(--text-primary);
        }
        
        .brand span {
            color: var(--primary);
        }
        
        .subtitle {
            font-size: 16px;
            color: var(--text-secondary);
            margin-bottom: 32px;
            line-height: 1.6;
        }
        
        .card {
            background: var(--bg-secondary);
            border: 1px solid var(--bg-surface2);
            border-radius: var(--radius);
            padding: 28px;
            margin-bottom: 24px;
        }
        
        .card-icon {
            width: 64px;
            height: 64px;
            background: var(--primary-alpha);
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 28px;
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .card-text {
            font-size: 14px;
            color: var(--text-secondary);
            line-height: 1.6;
        }
        
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 16px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: all 0.3s ease;
            margin-bottom: 12px;
            cursor: pointer;
            border: none;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:active {
            transform: translateY(0);
        }
        
        .btn-primary {
            background: var(--primary);
            color: var(--bg-primary);
        }
        
        .btn-primary:hover {
            background: var(--primary-light);
            box-shadow: 0 8px 24px rgba(245, 158, 11, 0.3);
        }
        
        .btn-secondary {
            background: var(--bg-surface2);
            color: var(--text-primary);
            border: 1px solid var(--bg-surface3);
        }
        
        .btn-secondary:hover {
            background: var(--bg-surface3);
            border-color: var(--primary);
        }
        
        .btn-icon {
            width: 22px;
            height: 22px;
        }
        
        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: var(--text-secondary);
            font-size: 14px;
        }
        
        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--bg-surface2);
        }
        
        .divider::before {
            margin-right: 16px;
        }
        
        .divider::after {
            margin-left: 16px;
        }
        
        .store-buttons {
            display: flex;
            gap: 12px;
        }
        
        .store-buttons .btn {
            flex: 1;
        }
        
        .footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        
        .footer a {
            color: var(--text-secondary);
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .footer a:hover {
            color: var(--primary);
        }
        
        .loading {
            display: none;
            margin-top: 16px;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--bg-surface2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .nfc-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120px;
            height: 120px;
            pointer-events: none;
            opacity: 0.15;
        }
        
        .nfc-pulse::before,
        .nfc-pulse::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            border: 2px solid var(--primary);
            border-radius: 50%;
            animation: pulse 2s ease-out infinite;
        }
        
        .nfc-pulse::before {
            width: 80px;
            height: 80px;
        }
        
        .nfc-pulse::after {
            width: 120px;
            height: 120px;
            animation-delay: 0.5s;
        }
        
        @keyframes pulse {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translate(-50%, -50%) scale(1.5);
                opacity: 0;
            }
        }
        
        @media (max-width: 480px) {
            .store-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <img src="/favicon.png" alt="TapStock" class="logo-icon">
            <h1 class="brand">Tap<span>Stock</span></h1>
        </div>
        <p class="subtitle">Du hast einen TapStock NFC-Tag gescannt.</p>
        
        <div class="card">
            <div class="card-icon">
                <div class="nfc-pulse"></div>
                📍
            </div>
            <p class="card-title">Spot öffnen</p>
            <p class="card-text">Öffne die TapStock App um den Inhalt dieses Spots anzuzeigen.</p>
        </div>
        
        <a href="#" id="openAppBtn" class="btn btn-primary">
            <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
            </svg>
            In TapStock öffnen
        </a>
        
        <div class="divider">App noch nicht installiert?</div>
        
        <div class="store-buttons">
            <a href="https://apps.apple.com/app/tapstock/id0000000000" class="btn btn-secondary" id="appStoreBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/>
                </svg>
                App Store
            </a>
            
            <a href="https://play.google.com/store/apps/details?id=de.innovarco.tapstock" class="btn btn-secondary" id="playStoreBtn">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M3,20.5V3.5C3,2.91 3.34,2.39 3.84,2.15L13.69,12L3.84,21.85C3.34,21.6 3,21.09 3,20.5M16.81,15.12L6.05,21.34L14.54,12.85L16.81,15.12M20.16,10.81C20.5,11.08 20.75,11.5 20.75,12C20.75,12.5 20.53,12.9 20.18,13.18L17.89,14.5L15.39,12L17.89,9.5L20.16,10.81M6.05,2.66L16.81,8.88L14.54,11.15L6.05,2.66Z"/>
                </svg>
                Play Store
            </a>
        </div>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="font-size: 14px; color: var(--text-secondary);">App wird geöffnet...</p>
        </div>
        
        <div class="footer">
            <p>© 2025 Innovarco UG · <a href="/impressum.html">Impressum</a> · <a href="/datenschutz.html">Datenschutz</a></p>
        </div>
    </div>

    <script>
        // Spot ID aus URL extrahieren (Pfad oder Query Parameter)
        const path = window.location.pathname;
        const params = new URLSearchParams(window.location.search);
        
        let spotId = null;
        const spotMatch = path.match(/\/spot\/([a-zA-Z0-9-]+)/i);
        if (spotMatch) {
            spotId = spotMatch[1];
        } else if (params.get('id')) {
            spotId = params.get('id');
        }
        
        // Deep Link URL
        const deepLink = spotId ? `tapstock://tapstock.com/spot?spotId=${spotId}` : null;
        
        // "In App öffnen" Button
        const openAppBtn = document.getElementById('openAppBtn');
        const loading = document.getElementById('loading');
        
        openAppBtn.addEventListener('click', function(e) {
            e.preventDefault();
            
            if (!deepLink) {
                alert('Ungültiger Link');
                return;
            }
            
            loading.classList.add('active');
            
            // Versuche App zu öffnen
            window.location.href = deepLink;
            
            // Fallback nach 2.5 Sekunden
            setTimeout(function() {
                loading.classList.remove('active');
            }, 2500);
        });
        
        // Automatisch versuchen App zu öffnen bei NFC-Scans
        if (deepLink) {
            setTimeout(function() {
                window.location.href = deepLink;
            }, 300);
        }
        
        // Platform-spezifischen Store-Button hervorheben
        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
        const isAndroid = /Android/.test(navigator.userAgent);
        
        if (isIOS) {
            document.getElementById('playStoreBtn').style.display = 'none';
        } else if (isAndroid) {
            document.getElementById('appStoreBtn').style.display = 'none';
        }
    </script>
</body>
</html>
